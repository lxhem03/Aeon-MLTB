
name: Inspect Docker Base Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check Docker
        run: docker version

      - name: Inspect Z-Mirror
        run: |
          docker pull dawn001/z_mirror:main
          docker image inspect dawn001/z_mirror:main
          docker run --rm --entrypoint /bin/sh dawn001/z_mirror:main -c '
            cat /etc/os-release
            python3 --version
            ffmpeg -version 2>&1 | head -n 2
            for cmd in aria2c qbittorrent-nox qbittorrent ffmpeg ffprobe rclone yt-dlp; do
              echo "Checking $cmd"
              command -v "$cmd" || true
            done
            python3 -m pip list 2>&1
          '

      - name: Inspect Aeon-MLTB
        run: |
          docker pull 5hojib/aeon:latest
          docker image inspect 5hojib/aeon:latest
          docker run --rm --entrypoint /bin/sh 5hojib/aeon:latest -c '
            cat /etc/os-release
            python3 --version
            ffmpeg -version 2>&1 | head -n 2
            for cmd in aria2c qbittorrent-nox qbittorrent ffmpeg ffprobe rclone yt-dlp; do
              echo "Checking $cmd"
              command -v "$cmd" || true
            done
            python3 -m pip list 2>&1
          '
